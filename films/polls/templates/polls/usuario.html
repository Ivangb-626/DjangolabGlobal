<h1>Aficionados</h1>

<p><a href="{% url 'polls:ver' %}">Ver peliculas</a></p>
<p><a href="{% url 'polls:votar' %}">Votar peliculas</a></p>
<p><a href="{% url 'polls:usuario' %}">Aficionados</a></p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>Titulo</th>
            <th>Usuarios que han votado</th>
        </tr>
    </thead>
    <tbody>
        {% for pelicula in peliculas %}
        <tr>
            <td>{{ pelicula.izenburua }}</td>
            <td>{{ pelicula.votantes_nombres }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No hay peliculas guardadas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<form method="post" action="{% url 'polls:logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesion</button>
</form>
